name: Trend paper trading v2 (только LONG, вымышленные деньги)

# v2 крутится параллельно с v1 и в отдельных файлах состояния. Смысл именно
# в одновременной работе: сравнение идёт вперёд, на одних и тех же рынках,
# а не подгонкой параметров задним числом под уже случившиеся сделки.

on:
  schedule:
    - cron: "5 * * * *"  # тот же 1H таймфрейм, что у v1, но со сдвигом на 5 минут,
                          # чтобы два бота не дрались за push в один и тот же момент
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trend-paper-trader-v2
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    env:
      BOT_VARIANT: v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Одна проверка по всей корзине (без реальных ордеров)
        run: python3 trend_paper_trader.py --once

      - name: Закоммитить состояние и обновить дашборд
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trend_paper_state_v2.json trend_paper_trades_log_v2.jsonl TREND_PAPER_STATUS_V2.md
          if git diff --cached --quiet; then
            echo "Изменений в состоянии нет"
          else
            git commit -m "trend-paper-trader v2: обновление статуса $(date -u +'%Y-%m-%d %H:%M UTC')"
          fi

          # Дашборд собирают три воркфлоу (trend v1, этот, meanrev v2) в одни
          # и те же файлы (dashboard/index.html, docs/index.html). Раньше он
          # собирался ДО pull и коммитился вместе со своим состоянием — git
          # pull --no-rebase почти гарантированно ловил конфликт на этом
          # полностью перегенерированном файле (сравнивать там нечего, текст
          # просто разный) — это и было причиной, по которой meanrev v2 15+
          # часов проваливал каждый коммит и молча не продвигался. Теперь
          # дашборд собирается заново ПОСЛЕ pull, из уже самого свежего
          # состояния — сливать нечего.
          for attempt in 1 2 3 4 5; do
            git pull --no-rebase --quiet

            python3 dashboard/build_dashboard.py
            git add dashboard/index.html docs/index.html
            if git diff --cached --quiet; then
              dash_committed=0
            else
              git commit -m "dashboard: обновление $(date -u +'%Y-%m-%d %H:%M UTC')"
              dash_committed=1
            fi

            if git push; then
              echo "Запушено с попытки $attempt"
              exit 0
            fi

            echo "Попытка $attempt: push отклонён (гонка с другим ботом), откатываю и пробую снова"
            if [ "$dash_committed" = "1" ]; then
              git reset --mixed HEAD~1
              git checkout -- dashboard/index.html docs/index.html
            fi
            sleep $((RANDOM % 8 + 3))
          done

          echo "Не удалось запушить после нескольких попыток" >&2
          exit 1
