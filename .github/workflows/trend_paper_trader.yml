name: Trend paper trading (портфель из 23 монет, вымышленные деньги)

on:
  schedule:
    - cron: "*/15 * * * *"  # таймфрейм 1H — раз в 15 минут достаточно, новую свечу не пропустим
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trend-paper-trader
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Одна проверка по всей корзине (без реальных ордеров)
        run: python3 trend_paper_trader.py --once

      - name: Закоммитить обновлённое состояние
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trend_paper_state.json trend_paper_trades_log.jsonl TREND_PAPER_STATUS.md
          if git diff --cached --quiet; then
            echo "Изменений нет, коммит не нужен"
          else
            git commit -m "trend-paper-trader: обновление статуса $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
