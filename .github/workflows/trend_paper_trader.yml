name: Trend paper trading (портфель из 23 монет, вымышленные деньги)

on:
  schedule:
    - cron: "0 * * * *"  # таймфрейм 1H — раз в час, в начале часа (UTC = начало часа в любом поясе)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trend-paper-trader
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Одна проверка по всей корзине (без реальных ордеров)
        run: python3 trend_paper_trader.py --once

      - name: Собрать дашборд (dashboard/index.html + docs/index.html для GitHub Pages)
        run: python3 dashboard/build_dashboard.py

      - name: Закоммитить обновлённое состояние
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trend_paper_state.json trend_paper_trades_log.jsonl TREND_PAPER_STATUS.md \
                  dashboard/index.html docs/index.html
          if git diff --cached --quiet; then
            echo "Изменений нет, коммит не нужен"
          else
            git commit -m "trend-paper-trader: обновление статуса и дашборда $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --no-rebase --quiet
            git push
          fi
